<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="FOMO desk">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>FOMO desk</title>
<style>
body{background:#000;color:#fff;font-family:-apple-system,system-ui,sans-serif;margin:0;padding:env(safe-area-inset-top) 16px 24px}
h1{font-size:20px;margin:18px 0 12px}
.card{background:#1c1c1e;border-radius:14px;padding:16px;margin-bottom:12px}
.k{color:#8e8e93;font-size:13px}.v{font-size:28px;font-weight:600;margin-top:4px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:#0a84ff;font-size:13px}
.err{color:#ff453a}
</style></head><body>
<h1>FOMO desk</h1>
<div id="setup" class="card" style="display:none">No data link yet. Open this page with <code>#d=&lt;id&gt;</code> at the end of the address.</div>
<div id="app" style="display:none">
<div class="card"><div class="k">Balance</div><div class="v" id="bal">-</div></div>
<div class="card"><div class="k">Mode</div><div class="v"><span class="pill" id="mode">-</span></div></div>
<div class="card"><div class="k">Status</div><div id="msg">-</div></div>
<div class="card"><div class="k">Last update</div><div id="upd">-</div><div class="k" id="stale"></div></div>
</div>
<script>
(function(){
var m=location.hash.match(/[#&]d=([0-9a-fA-F]+)/);
if(m){try{localStorage.setItem('desk_gist',m[1]);}catch(e){}
 history.replaceState(null,'',location.pathname+location.search);}
var id=null;try{id=localStorage.getItem('desk_gist');}catch(e){}
if(!id){document.getElementById('setup').style.display='block';return;}
document.getElementById('app').style.display='block';
var U='https://gist.githubusercontent.com/tzddc8gn7d-art/'+id+'/raw/state.json';
function $(i){return document.getElementById(i);}
function tick(){
 fetch(U+'?ts='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
 .then(function(s){
  $('bal').textContent=(s.balance_usd!=null)?'$'+Number(s.balance_usd).toFixed(2):'-';
  $('mode').textContent=s.mode||'-';
  $('msg').textContent=s.message||'-';
  var t=s.ts?new Date(s.ts*1000):null;
  $('upd').textContent=t?t.toLocaleString():'-';
  var age=t?Math.round((Date.now()-t)/1000):null;
  $('stale').textContent=age==null?'':(age>120?'stale: '+age+'s old':'');
 }).catch(function(e){$('msg').innerHTML='<span class="err">'+e.message+'</span>';});
}
tick();setInterval(tick,15000);
})();
</script></body></html>
